name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt  # Prophet not installed; TestHistoricalV4 falls back to Holt's
          pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Page import smoke test
        run: |
          python -c "
          import importlib, importlib.util, os, sys, pathlib

          failures = []
          for root, _, files in os.walk('pages'):
              for fname in sorted(files):
                  if not fname.endswith('.py') or fname.startswith('__'):
                      continue
                  page_file = pathlib.Path(root) / fname
                  rel = page_file.relative_to('pages')
                  mod_name = f'_smoke_{\"-\".join(rel.with_suffix(\"\").parts)}'
                  spec = importlib.util.spec_from_file_location(mod_name, page_file)
                  module = importlib.util.module_from_spec(spec)
                  sys.modules[mod_name] = module
                  try:
                      spec.loader.exec_module(module)
                  except (NameError, ImportError, SyntaxError) as exc:
                      failures.append((str(page_file), type(exc).__name__, str(exc)))
                  except Exception as exc:
                      exc_mod = getattr(type(exc), '__module__', '') or ''
                      if 'streamlit' in exc_mod.lower():
                          pass
                      elif type(exc).__name__ in {'StreamlitAPIException', 'NoSessionContext', 'StopException', 'RerunException'}:
                          pass
                      elif isinstance(exc, TypeError):
                          failures.append((str(page_file), 'TypeError', str(exc)))
                  finally:
                      sys.modules.pop(mod_name, None)

          if failures:
              for name, etype, msg in failures:
                  print(f'FAIL {name}: {etype}: {msg}')
              sys.exit(1)
          print('All pages imported cleanly.')
          "
      - name: Pytest
        run: python -m pytest tests/ -v
