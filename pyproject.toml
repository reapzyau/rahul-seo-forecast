[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    ".streamlit",
    "assets",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (undefined names, unused imports)
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # bugbear (likely bugs)
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — Streamlit pages need st.set_page_config before imports
    "B008",   # function call in default arg — acceptable for pandas
]

[tool.ruff.lint.per-file-ignores]
"pages/*.py" = ["E402"]   # pages have st.header() etc. before some imports
"tests/*.py" = ["F401"]   # tests import things for side effects
